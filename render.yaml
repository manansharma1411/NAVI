# Render Blueprint specification for NAVI monorepo
# Documentation: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: navi-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false # Set to your deployed Vercel frontend URL (e.g. https://navi-web.vercel.app)
      - key: GEMINI_API_KEY
        sync: false # Optional: provide your Gemini API key in Render dashboard
